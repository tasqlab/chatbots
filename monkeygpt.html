<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>monkeygpt</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1e1e2e;
      --surface: #282836;
      --text: #cdd6f4;
      --subtext: #a6adc8;
      --accent: #f5c211;
      --accent-hover: #e0b000;
      --border: #313244;
      --error: #f38ba8;
      --font: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      border-bottom: 2px solid var(--border);
    }
    h1 { font-weight: 700; letter-spacing: -1px; }
    .accent { color: var(--accent); }
    #settings-btn {
      background: none; border: none; color: var(--subtext);
      font-size: 1.2rem; cursor: pointer; padding: 0.5rem;
      transition: color 0.2s;
    }
    #settings-btn:hover { color: var(--accent); }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .message {
      max-width: 80%;
      line-height: 1.6;
      padding: 0.6rem 0;
      word-break: break-word;
    }
    .message.user { align-self: flex-end; color: var(--accent); }
    .message.ai { align-self: flex-start; color: var(--text); }
    .message.system { align-self: center; color: var(--subtext); font-style: italic; opacity: 0.7; }
    .cursor::after { content: "▋"; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .input-area {
      padding: 1rem 2rem 1.5rem;
      background: var(--bg);
      border-top: 2px solid var(--border);
      display: flex;
      gap: 0.8rem;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 1rem;
      padding: 0.5rem 0;
      resize: none;
      outline: none;
      min-height: 2.5rem;
      max-height: 9rem;
      transition: border-color 0.2s;
    }
    textarea:focus { border-bottom-color: var(--accent); }
    #send-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 0.6rem 1rem;
      font-family: var(--font);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      height: 2.5rem;
    }
    #send-btn:hover { background: var(--accent-hover); }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #settings-panel {
      position: fixed;
      top: 0; right: 0;
      width: 320px;
      height: 100%;
      background: var(--surface);
      padding: 2rem;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      border-left: 2px solid var(--border);
      z-index: 100;
    }
    #settings-panel.open { transform: translateX(0); }
    #settings-panel h2 { margin-bottom: 1.5rem; color: var(--accent); }
    label { display: block; margin-bottom: 1.2rem; color: var(--subtext); font-size: 0.9rem; }
    input, select {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.3rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    #save-settings {
      width: 100%;
      padding: 0.7rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      font-family: var(--font);
      font-weight: 700;
      cursor: pointer;
      margin-top: 1rem;
    }
    .warning { color: var(--error); font-size: 0.8rem; margin-top: 0.5rem; }
    .hidden { display: none; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 0; }
    ::-webkit-scrollbar-thumb:hover { background: var(--subtext); }
  </style>
</head>
<body>
  <header>
    <h1>monkey<span class="accent">gpt</span></h1>
    <button id="settings-btn" title="Settings">⚙️</button>
  </header>

  <main id="chat-container">
    <div class="message system">welcome to monkeygpt. configure your groq key in settings, then type below.</div>
  </main>

  <div class="input-area">
    <textarea id="user-input" placeholder="type your message..." rows="1"></textarea>
    <button id="send-btn" disabled>↵</button>
  </div>

  <div id="settings-panel">
    <h2>settings</h2>
    <label>
      groq api key
      <input type="password" id="api-key" placeholder="gsk_...">
      <div class="warning">⚠️ stored locally. use a backend proxy for production.</div>
    </label>
    <label>
      model
      <select id="model-select">
        <option value="llama-3.3-70b-versatile">llama-3.3-70b</option>
        <option value="mixtral-8x22b-32768">mixtral-8x22b</option>
        <option value="qwen-2.5-72b">qwen-2.5-72b</option>
        <option value="deepseek-r1-distill-llama-70b">deepseek-r1-70b</option>
      </select>
    </label>
    <button id="save-settings">save & close</button>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const settingsBtn = document.getElementById('settings-btn');
    const settingsPanel = document.getElementById('settings-panel');
    const apiKeyInput = document.getElementById('api-key');
    const modelSelect = document.getElementById('model-select');
    const saveBtn = document.getElementById('save-settings');

    let apiKey = localStorage.getItem('groq_api_key') || '';
    let currentModel = localStorage.getItem('groq_model') || 'llama-3.3-70b-versatile';
    let messages = [];
    let isStreaming = false;

    apiKeyInput.value = apiKey;
    modelSelect.value = currentModel;

    // Settings toggle
    settingsBtn.onclick = () => settingsPanel.classList.toggle('open');
    saveBtn.onclick = () => {
      apiKey = apiKeyInput.value.trim();
      currentModel = modelSelect.value;
      localStorage.setItem('groq_api_key', apiKey);
      localStorage.setItem('groq_model', currentModel);
      settingsPanel.classList.remove('open');
      updateUIState();
    };

    function updateUIState() {
      sendBtn.disabled = !apiKey || isStreaming;
    }
    updateUIState();

    // Auto-resize textarea
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 144) + 'px';
    });

    // Send on Enter, newline on Shift+Enter
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    sendBtn.addEventListener('click', sendMessage);

    function addMessage(role, content, isStreaming = false) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = content;
      if (isStreaming) div.classList.add('cursor');
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isStreaming || !apiKey) return;

      userInput.value = '';
      userInput.style.height = 'auto';
      isStreaming = true;
      updateUIState();

      addMessage('user', text);
      const aiBubble = addMessage('ai', '', true);
      aiBubble.textContent = '';
      messages.push({ role: 'user', content: text });

      try {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: currentModel,
            messages: messages,
            stream: true
          })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error?.message || `HTTP ${res.status}`);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || !trimmed.startsWith('data: ')) continue;
            const data = trimmed.slice(6);
            if (data === '[DONE]') continue;

            try {
              const json = JSON.parse(data);
              const content = json.choices?.[0]?.delta?.content;
              if (content) {
                aiBubble.textContent += content;
                chatContainer.scrollTop = chatContainer.scrollHeight;
              }
            } catch (e) {}
          }
        }

        messages.push({ role: 'assistant', content: aiBubble.textContent });
      } catch (err) {
        aiBubble.textContent = `⚠️ ${err.message}`;
        aiBubble.style.color = 'var(--error)';
      } finally {
        isStreaming = false;
        aiBubble.classList.remove('cursor');
        updateUIState();
      }
    }
  </script>
</body>
</html>
