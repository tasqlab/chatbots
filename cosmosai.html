<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cosmos ai</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --bg2: #12121a;
      --surface: rgba(30, 30, 50, 0.6);
      --text: #e8e8f0;
      --subtext: #a0a0b8;
      --accent: #a855f7;
      --accent2: #6366f1;
      --border: rgba(168, 85, 247, 0.2);
      --error: #ef4444;
      --font: 'Space Grotesk', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    /* Animated stars background */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.3;
      animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.2); }
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(20px);
      z-index: 10;
      gap: 1rem;
    }
    .header-left { display: flex; align-items: center; gap: 0.75rem; }
    #sidebar-btn {
      background: none; border: none; color: var(--subtext);
      font-size: 1.1rem; cursor: pointer; padding: 0.4rem;
      transition: all 0.2s; border-radius: 6px;
    }
    #sidebar-btn:hover { color: var(--accent); background: rgba(168, 85, 247, 0.1); }
    h1 { font-weight: 600; font-size: 1.25rem; letter-spacing: -0.02em; }
    .gradient-text{
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #settings-btn {
      background: none; border: none; color: var(--subtext);
      font-size: 1.1rem; cursor: pointer; padding: 0.4rem;
      transition: all 0.2s; border-radius: 6px;
    }
    #settings-btn:hover { color: var(--accent); background: rgba(168, 85, 247, 0.1); }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      z-index: 1;
      position: relative;
    }
    .message {
      max-width: 85%;
      padding: 1rem 1.25rem;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 0.95rem;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.ai {
      align-self: flex-start;
      background: var(--surface);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .message.ai h1, .message.ai h2, .message.ai h3 {
      margin: 12px 0 8px;
      font-weight: 600;
    }
    .message.ai h1 { font-size: 1.2rem; color: var(--accent); }
    .message.ai h2 { font-size: 1.05rem; color: var(--accent2); }
    .message.ai p { margin: 8px 0; }
    .message.ai code {
      background: rgba(168, 85, 247, 0.15);
      padding: 2px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85em;
    }
    .message.ai pre {
      background: rgba(0, 0, 0, 0.4);
      padding: 1rem;
      border-radius: 12px;
      overflow-x: auto;
      margin: 12px 0;
      border: 1px solid var(--border);
    }
    .message.ai pre code { background: none; padding: 0; }
    .message.ai ul, .message.ai ol { margin: 8px 0; padding-left: 24px; }
    .message.ai li { margin: 4px 0; }
    .message.ai blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 16px;
      margin: 12px 0;
      color: var(--subtext);
      font-style: italic;
    }
    .message.ai a { color: var(--accent); text-decoration: none; }
    .message.ai a:hover { text-decoration: underline; }
    .message.ai table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0;
      font-size: 0.9em;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      overflow: hidden;
    }
    .message.ai th, .message.ai td {
      border: 1px solid var(--border);
      padding: 10px 14px;
      text-align: left;
    }
    .message.ai th { background: rgba(168, 85, 247, 0.15); color: var(--accent); }
    .message.system {
      align-self: center;
      color: var(--subtext);
      font-size: 0.85rem;
      font-style: italic;
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 20px;
    }
    .cursor::after { content: "▋"; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .input-area {
      padding: 1rem 1.5rem 1.5rem;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      z-index: 10;
    }
    textarea {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.95rem;
      padding: 0.875rem 1rem;
      resize: none;
      outline: none;
      min-height: 48px;
      max-height: 150px;
      transition: all 0.2s;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1);
    }
    #send-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      font-family: var(--font);
      font-weight: 600;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.2s;
      height: 48px;
    }
    #send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(168, 85, 247, 0.3);
    }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    #sidebar, #settings-panel {
      position: fixed;
      top: 0; right: 0;
      width: 300px;
      height: 100%;
      background: rgba(18, 18, 26, 0.95);
      backdrop-filter: blur(30px);
      padding: 1.5rem;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      border-left: 1px solid var(--border);
      z-index: 100;
      overflow-y: auto;
    }
    #sidebar.open, #settings-panel.open { transform: translateX(0); }
    #sidebar h2, #settings-panel h2 {
      margin-bottom: 1.25rem;
      font-size: 1.1rem;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .new-chat-btn {
      width: 100%; padding: 0.75rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      color: white;
      font-family: var(--font); font-weight: 600;
      cursor: pointer; border-radius: 10px;
      margin-bottom: 1rem; transition: all 0.2s;
    }
    .new-chat-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(168, 85, 247, 0.3);
    }
    .chat-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .chat-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.75rem; border-radius: 10px;
      cursor: pointer; transition: all 0.2s;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.02);
    }
    .chat-item:hover { background: rgba(168, 85, 247, 0.1); }
    .chat-item.active {
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid var(--border);
    }
    .chat-item .chat-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-item .chat-delete {
      opacity: 0; color: var(--subtext); cursor: pointer;
      transition: opacity 0.2s, color 0.2s;
      padding: 0.25rem;
    }
    .chat-item:hover .chat-delete { opacity: 1; }
    .chat-delete:hover { color: var(--error); }
    label { display: block; margin-bottom: 1.25rem; color: var(--subtext); font-size: 0.9rem; }
    select {
      width: 100%;
      padding: 0.625rem;
      margin-top: 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font);
      outline: none;
      transition: all 0.2s;
    }
    select:focus { border-color: var(--accent); }
    #save-settings {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      color: white;
      font-family: var(--font);
      font-weight: 600;
      cursor: pointer;
      border-radius: 10px;
      margin-top: 0.5rem;
      transition: all 0.2s;
    }
    #save-settings:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(168, 85, 247, 0.3);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <header>
    <div class="header-left">
      <button id="sidebar-btn" title="Chats">☰</button>
      <h1>cosmos<span class="gradient-text">ai</span></h1>
    </div>
    <button id="settings-btn" title="Settings">⚙️</button>
  </header>

  <main id="chat-container">
    <div class="message system">welcome to cosmos ai. explore the universe of knowledge.</div>
  </main>

  <div class="input-area">
    <textarea id="user-input" placeholder="ask anything..." rows="1"></textarea>
    <button id="send-btn">→</button>
  </div>

  <div id="sidebar">
    <h2>conversations</h2>
    <button class="new-chat-btn" id="new-chat-btn">+ new chat</button>
    <div class="chat-list" id="chat-list"></div>
  </div>

  <div id="settings-panel">
    <h2>settings</h2>
    <label>
      model
      <select id="model-select">
        <option value="openai/gpt-oss-120b">gpt-oss-120b</option>
        <option value="llama-3.3-70b-versatile">llama-3.3-70b</option>
        <option value="qwen/qwen3-32b">qwen3-32b</option>
      </select>
    </label>
    <button id="save-settings">save & close</button>
  </div>

  <script>
    const WORKER_URL = "https://velocity-groq-proxy.tchazq1n.workers.dev";

    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const sidebarBtn = document.getElementById('sidebar-btn');
    const sidebar = document.getElementById('sidebar');
    const settingsBtn = document.getElementById('settings-btn');
    const settingsPanel = document.getElementById('settings-panel');
    const newChatBtn = document.getElementById('new-chat-btn');
    const chatListEl = document.getElementById('chat-list');
    const modelSelect = document.getElementById('model-select');
    const saveBtn = document.getElementById('save-settings');

    let currentModel = localStorage.getItem('cosmosai_model') || 'openai/gpt-oss-120b';
    let messages = [];
    let isStreaming = false;
    let chats = JSON.parse(localStorage.getItem('cosmosai_chats') || '{}');
    let currentChatId = localStorage.getItem('cosmosai_current_chat') || null;

    modelSelect.value = currentModel;

    // Create animated stars
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 100; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      starsContainer.appendChild(star);
    }

    // Panel toggles
    sidebarBtn.onclick = () => { settingsPanel.classList.remove('open'); sidebar.classList.toggle('open'); renderChatList(); };
    settingsBtn.onclick = () => { sidebar.classList.remove('open'); settingsPanel.classList.toggle('open'); };
    saveBtn.onclick = () => {
      currentModel = modelSelect.value;
      localStorage.setItem('cosmosai_model', currentModel);
      settingsPanel.classList.remove('open');
    };

    function updateUIState() {
      sendBtn.disabled = isStreaming;
    }
    updateUIState();

    // Chat management
    function generateId() { return 'chat_' + Date.now(); }

    function createNewChat() {
      const id = generateId();
      chats[id] = { id, title: 'new conversation', messages: [], createdAt: Date.now() };
      saveChats();
      loadChat(id);
      renderChatList();
    }

    function saveChats() {
      localStorage.setItem('cosmosai_chats', JSON.stringify(chats));
    }

    function loadChat(id) {
      currentChatId = id;
      localStorage.setItem('cosmosai_current_chat', id);
      messages = chats[id]?.messages || [];
      chatContainer.innerHTML = '';
      if (messages.length === 0) {
        addMessage('system', 'welcome to cosmos ai. explore the universe of knowledge.');
      } else {
        messages.forEach(m => {
          if (m.role === 'user') addMessage('user', m.content);
          else if (m.role === 'assistant') {
            const div = addMessage('ai', '');
            div.innerHTML = DOMPurify.sanitize(marked.parse(m.content));
          }
        });
      }
      renderChatList();
      sidebar.classList.remove('open');
    }

    function deleteChat(id, e) {
      e.stopPropagation();
      if (!confirm('delete this conversation?')) return;
      delete chats[id];
      saveChats();
      if (currentChatId === id) {
        const remaining = Object.keys(chats);
        if (remaining.length > 0) loadChat(remaining[0]);
        else createNewChat();
      }
      renderChatList();
    }

    function renderChatList() {
      chatListEl.innerHTML = '';
      const sorted = Object.values(chats).sort((a, b) => b.createdAt - a.createdAt);
      sorted.forEach(chat => {
        const item = document.createElement('div');
        item.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
        item.innerHTML = `
          <span>✦</span>
          <span class="chat-title">${escapeHtml(chat.title || 'new conversation')}</span>
          <span class="chat-delete" title="Delete">×</span>
        `;
        item.onclick = () => loadChat(chat.id);
        item.querySelector('.chat-delete').onclick = (e) => deleteChat(chat.id, e);
        chatListEl.appendChild(item);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    newChatBtn.onclick = createNewChat;

    // Init
    if (!currentChatId || !chats[currentChatId]) {
      createNewChat();
    } else {
      loadChat(currentChatId);
    }

    // Auto-resize textarea
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
    });

    // Send on Enter, newline on Shift+Enter
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    sendBtn.addEventListener('click', sendMessage);

    // Configure marked for markdown parsing
    marked.setOptions({ breaks: true, gfm: true, headerIds: false, mangle: false });

    function addMessage(role, content, isStreaming = false) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      if (role === 'ai') {
        div.innerHTML = DOMPurify.sanitize(marked.parse(content));
      } else {
        div.textContent = content;
      }
      if (isStreaming) div.classList.add('cursor');
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isStreaming) return;

      userInput.value = '';
      userInput.style.height = 'auto';
      isStreaming = true;
      updateUIState();

      addMessage('user', text);
      const aiBubble = addMessage('ai', '', true);
      aiBubble.textContent = '';
      messages.push({ role: 'user', content: text });

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: currentModel,
            messages: messages,
            temperature: 0.7,
            max_tokens: 2048
          })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${res.status}`);
        }

        const data = await res.json();
        const reply = data.choices?.[0]?.message?.content || 'No response.';

        // Typewriter effect with raw text
        aiBubble.textContent = '';
        for (let i = 0; i < reply.length; i++) {
          aiBubble.textContent += reply[i];
          chatContainer.scrollTop = chatContainer.scrollHeight;
          await new Promise(r => setTimeout(r, 5));
        }

        // Render final markdown after streaming
        aiBubble.innerHTML = DOMPurify.sanitize(marked.parse(reply));

        messages.push({ role: 'assistant', content: reply });
        // Update chat title on first message
        if (chats[currentChatId] && messages.filter(m => m.role === 'user').length === 1) {
          chats[currentChatId].title = text.slice(0, 30) + (text.length > 30 ? '…' : '');
          saveChats();
        }
        if (chats[currentChatId]) {
          chats[currentChatId].messages = messages;
          saveChats();
        }
      } catch (err) {
        aiBubble.textContent = `⚠️ ${err.message}`;
        aiBubble.style.color = 'var(--error)';
      } finally {
        isStreaming = false;
        aiBubble.classList.remove('cursor');
        updateUIState();
      }
    }
  </script>
</body>
</html>
